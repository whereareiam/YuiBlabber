[versions]

# general
yui = "dev"
yui-synapse = "dev"
lombok = "1.18.38"
spring = "3.5.4"
jda = "5.6.1"

# plugins
shadow = "8.3.6"

[libraries]

# general
yui = { group = "me.whereareiam", name = "Yui", version.ref = "yui" }
yui-synapse = { group = "me.whereareiam", name = "YuiSynapse", version.ref = "yui-synapse" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
spring-boot = { group = "org.springframework.boot", name = "spring-boot-starter", version.ref = "spring" }
spring-webflux = { group = "org.springframework.boot", name = "spring-boot-starter-webflux", version.ref = "spring" }
jda = { group = "net.dv8tion", name = "JDA", version.ref = "jda" }

[plugins]

shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[bundles]

yui = [
    "yui",
    "yui-synapse"
]

spring = [
    "spring-boot",
    "spring-webflux"
]